[profile.default]
src = "contracts"
script = "script"
test = "contracts/test"
out = "out"
cache_path = "forge-cache"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "solmate/=lib/solmate/src/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
base = "${ALCHEMY_HTTP_URL}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }
